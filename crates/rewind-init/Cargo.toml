[package]
name = "rewind-init"
description = "The Rewind VM guest's init, and the job it runs"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Built on its own, static against musl, by nix/guest.nix.
[workspace]

# The engine's lints (the root Cargo.toml's [workspace.lints], which a
# workspace of its own cannot inherit), checked by checks.init-clippy.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[[bin]]
name = "rewind-init"
path = "src/main.rs"
required-features = ["nar"]

# NAR hashing reads files and links, which the browser viewer, reading
# traces through rewind-trace in wasm32, has none of and cannot compile.
[features]
default = ["nar"]
nar = ["dep:nix-archive"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Output NAR hashes, which the host compares with Nix's narHash.
nix-archive = { version = "0.6", optional = true }
