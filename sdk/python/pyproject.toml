[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rewind-sdk"
version = "0.1.0"
description = "Assertions and test marks for Rewind VM's rewind check"
license = { text = "MIT" }
requires-python = ">=3.8"

[project.urls]
Repository = "https://github.com/fzakaria/rewindvm"

[project.entry-points.pytest11]
rewind = "rewind_sdk.pytest_plugin"

[tool.setuptools]
packages = ["rewind_sdk"]
